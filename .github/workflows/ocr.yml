name: OCR Handwritten PDF to Markdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests PyMuPDF google-genai

      - name: Run OCR Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ocr_pdf.py

      - name: Commit and Push Markdown Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add surabhi_srivastava_gs3_transcribed.md
          git commit -m "Add transcribed handwritten PDF to markdown" || echo "No changes to commit"
          git push
