name: Compress PDF from URL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests PyMuPDF

      - name: Run Compression Script
        run: |
          python compress_pdf.py

      - name: Create Public Release with Compressed PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed-v1.0.${{ github.run_number }}
          name: Compressed Surabhi Srivastava GS3 PDF
          body: "Direct public download link for the compressed PDF."
          files: compressed_surabhi_srivastava_gs3.pdf
