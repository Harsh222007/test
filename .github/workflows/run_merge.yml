name: Run PDF Merger

on:
  workflow_dispatch:

permissions:
  contents: write  # Needed to publish a public Release

jobs:
  build-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pypdf

      - name: Run Script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python merge_next_ias.py

      - name: Create Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Next IAS GS4 Merged PDF
          body: "Public direct download link for Next IAS GS4 Merged PDF."
          files: Next_IAS_GS4_Merged.pdf
