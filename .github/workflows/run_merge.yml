name: Run Vision IAS PDF Merger

on:
  workflow_dispatch:

permissions:
  contents: write  # Grants permission to create public Release links

jobs:
  build-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pypdf

      - name: Run Script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python merge_vision_ias.py

      - name: Check Output File
        run: |
          ls -lh Vision_IAS_GS4_Merged.pdf || echo "File not found!"

      - name: Create Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vision-v1.0.${{ github.run_number }}
          name: Vision IAS GS4 Merged PDF
          body: "Public direct download link for all 54 Vision IAS GS4 Topper Answer Copies."
          files: Vision_IAS_GS4_Merged.pdf
